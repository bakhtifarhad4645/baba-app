name: Build Baba APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Baba project
        run: |
          mkdir -p source
          unzip -q Baba_OneClick_PhoneBuild.zip -d source

      - name: Find Android project
        id: project
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE/source" -name settings.gradle -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "dir=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Baba APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        id: apk
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/Baba.apk

      - name: Upload Baba APK
        uses: actions/upload-artifact@v4
        with:
          name: Baba-APK
          path: output/Baba.apk
