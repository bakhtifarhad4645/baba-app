name: Build Baba Offline APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract offline project
        run: |
          mkdir -p source
          unzip -q Baba_Offline_v3.zip -d source

      - name: Find Android project
        id: project
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE/source" -name settings.gradle -type f | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "dir=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Baba Offline APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Baba-Offline.apk

      - name: Upload Baba Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Baba-Offline-APK
          path: output/Baba-Offline.apk
